<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2952CC">
<title>EON — Il tuo lavoro</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EON">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F7FC; --card:#FFFFFF;
    --border:rgba(20,30,60,.08); --border-strong:rgba(20,30,60,.15);
    --text:#0E1424; --muted:#5B6478; --faint:#98A0B4;
    --indigo:#2F5CF6; --indigo-soft:rgba(47,92,246,.09);
    --grad-blue:linear-gradient(135deg, #3E6BFF 0%, #2144D6 100%);
    --teal:#0E9F84; --teal-soft:rgba(14,159,132,.11);
    --amber:#C9860B; --amber-soft:rgba(201,134,11,.12);
    --green:#16A34A; --green-soft:rgba(22,163,74,.11);
    --coral:#E4572E; --coral-soft:rgba(228,87,46,.10);
    --shadow-sm:0 1px 2px rgba(20,23,29,.05), 0 1px 1px rgba(20,23,29,.04);
    --shadow-md:0 10px 30px rgba(20,23,29,.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ font-family:'Manrope', sans-serif; margin:0; }

  .app{
    max-width:460px; margin:0 auto; height:100%;
    display:flex; flex-direction:column;
    background:var(--card); box-shadow:0 0 60px rgba(20,23,29,.08);
  }

  /* intestazione con il nome del professionista */
  .head{
    padding:16px 18px calc(14px + 0px);
    border-bottom:1px solid var(--border); flex:none;
    display:flex; align-items:center; gap:12px;
  }
  .head-avatar{
    width:42px; height:42px; border-radius:50%; flex:none;
    background:var(--grad-blue); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-family:'Manrope'; font-weight:800; font-size:15px;
  }
  .head-name{ font-size:15.5px; font-weight:800; }
  .head-sub{ font-size:11.5px; color:var(--muted); margin-top:1px; }
  .head-logo{
    margin-left:auto; display:flex; align-items:center; gap:1px;
    font-family:'Manrope'; font-weight:900; font-size:15px; color:var(--faint);
  }
  .head-logo .o{
    width:14px; height:14px; border-radius:50%; margin:0 1px;
    background:var(--grad-blue); color:#fff;
    display:inline-flex; align-items:center; justify-content:center;
  }
  .head-logo .o svg{ width:9px; height:9px; }

  /* linguette: Lavoro / Messaggi */
  .tabs{ display:flex; gap:6px; padding:12px 14px; border-bottom:1px solid var(--border); flex:none; }
  .tab{
    flex:1; text-align:center; padding:10px; border-radius:12px; cursor:pointer;
    font-size:13px; font-weight:700; color:var(--muted); background:#FBFAF8;
    border:1px solid var(--border);
  }
  .tab.active{ background:var(--indigo-soft); color:var(--indigo); border-color:rgba(47,92,246,.4); }

  .panel{ flex:1; overflow-y:auto; display:none; }
  .panel.visible{ display:flex; flex-direction:column; }

  /* --- scheda Lavoro --- */
  .work{ padding:18px 16px 24px; }
  .status-card{
    background:var(--card); border:1.5px solid var(--border); border-radius:18px;
    padding:18px; box-shadow:var(--shadow-sm); margin-bottom:14px;
  }
  .status-eyebrow{ font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.07em; color:var(--faint); margin-bottom:8px; }
  .status-title{ font-size:18px; font-weight:900; letter-spacing:-.01em; margin-bottom:6px; }
  .status-desc{ font-size:13px; color:var(--muted); line-height:1.55; }
  .status-pill{
    display:inline-block; font-size:11.5px; font-weight:700;
    padding:5px 12px; border-radius:20px; margin-top:12px;
  }
  .status-pill.attivo{ background:var(--green-soft); color:var(--green); }
  .status-pill.trattativa{ background:var(--amber-soft); color:var(--amber); }
  .status-pill.inattivo{ background:rgba(20,23,29,.05); color:var(--faint); }

  .section-title{
    font-size:11.5px; font-weight:800; text-transform:uppercase; letter-spacing:.06em;
    color:var(--faint); margin:20px 0 10px 2px;
  }
  .doc-row{
    display:flex; align-items:center; gap:12px; padding:14px;
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    margin-bottom:9px; box-shadow:var(--shadow-sm);
  }
  .doc-icon{
    width:38px; height:38px; border-radius:12px; flex:none; color:#fff;
    display:flex; align-items:center; justify-content:center;
  }
  .doc-icon svg{ width:17px; height:17px; }
  .doc-body{ flex:1; min-width:0; }
  .doc-title{ font-size:13.5px; font-weight:700; }
  .doc-sub{ font-size:11.5px; color:var(--muted); margin-top:2px; }
  .doc-amount{ font-family:'Manrope'; font-size:14px; font-weight:800; flex:none; }

  .empty{
    text-align:center; padding:30px 20px; color:var(--muted);
    font-size:13px; line-height:1.6;
  }
  .empty b{ display:block; color:var(--text); font-size:14px; margin-bottom:5px; }

  /* --- scheda Messaggi --- */
  .messages{ flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:9px; }
  .bubble{ max-width:76%; padding:10px 14px; border-radius:17px; font-size:14px; line-height:1.45; }
  /* dal punto di vista del cliente i ruoli sono invertiti:
     "me" del professionista arriva a sinistra, "them" (il cliente) a destra */
  .bubble.pro{ background:#F1F0EC; color:var(--text); align-self:flex-start; border-bottom-left-radius:4px; }
  .bubble.mine{ background:var(--grad-blue); color:#fff; align-self:flex-end; border-bottom-right-radius:4px; font-weight:500; }
  .bubble-time{ font-size:10px; opacity:.65; margin-top:4px; display:block; }

  .chat-event{
    align-self:flex-start; max-width:86%; background:var(--card); border:1px solid var(--border);
    border-radius:16px; border-bottom-left-radius:4px; box-shadow:var(--shadow-sm); padding:11px 13px;
  }
  .chat-event-tag{
    display:inline-flex; align-items:center; gap:5px; font-size:9.5px; font-weight:800;
    text-transform:uppercase; letter-spacing:.04em; padding:3px 8px; border-radius:20px; margin-bottom:6px;
  }
  .chat-event-tag.doc{ background:var(--indigo-soft); color:var(--indigo); }
  .chat-event-tag.appt{ background:var(--amber-soft); color:var(--amber); }
  .chat-event-tag.update{ background:var(--teal-soft); color:var(--teal); }
  .chat-event-tag svg{ width:9px; height:9px; }
  .chat-event-title{ font-size:13px; font-weight:700; margin-bottom:1px; }
  .chat-event-text{ font-size:12px; color:var(--muted); line-height:1.45; }
  .chat-event-amount{ font-size:14.5px; font-weight:900; margin-top:5px; }
  .chat-event-time{ font-size:9.5px; opacity:.55; margin-top:5px; display:block; }

  .input-row{
    display:flex; gap:9px; padding:12px 14px calc(12px + env(safe-area-inset-bottom, 0px));
    border-top:1px solid var(--border); flex:none; background:var(--card);
  }
  .input-row input{
    flex:1; border:1px solid var(--border); background:#FBFAF8;
    border-radius:20px; padding:12px 16px; font-size:14px; color:var(--text); font-family:inherit;
  }
  .input-row input:focus{ outline:2px solid var(--indigo); outline-offset:1px; }
  .send{
    width:44px; height:44px; border-radius:50%; flex:none; border:none; cursor:pointer;
    background:var(--grad-blue); color:#fff;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 12px rgba(47,92,246,.3);
  }
  .send svg{ width:18px; height:18px; }

  /* schermata di caricamento / errore */
  .gate{
    position:fixed; inset:0; background:var(--bg); z-index:20;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:30px; text-align:center; max-width:460px; margin:0 auto;
  }
  .gate.hidden{ display:none; }
  .gate-logo{
    display:flex; align-items:center; gap:2px;
    font-family:'Manrope'; font-weight:900; font-size:34px; margin-bottom:16px;
  }
  .gate-logo .o{
    width:27px; height:27px; border-radius:50%; margin:0 1px;
    background:var(--grad-blue); color:#fff;
    display:inline-flex; align-items:center; justify-content:center;
  }
  .gate-logo .o svg{ width:16px; height:16px; }
  .gate-text{ font-size:13.5px; color:var(--muted); line-height:1.6; max-width:300px; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-logo">
    <span>E</span>
    <span class="o"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9.5"/><path d="M12 7.2v5l3.6 2.1" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <span>N</span>
  </div>
  <div class="gate-text" id="gateText">Un attimo, sto aprendo la tua pagina…</div>
</div>

<div class="app">
  <div class="head">
    <div class="head-avatar" id="proAvatar">–</div>
    <div>
      <div class="head-name" id="proName">—</div>
      <div class="head-sub" id="proSub">Il tuo referente</div>
    </div>
    <div class="head-logo">
      <span>E</span>
      <span class="o"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="9.5"/><path d="M12 7.2v5l3.6 2.1" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span>N</span>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" id="tabLavoro">Il tuo lavoro</div>
    <div class="tab" id="tabMessaggi">Messaggi</div>
  </div>

  <!-- scheda: il tuo lavoro -->
  <div class="panel visible" id="panelLavoro">
    <div class="work">
      <div class="status-card">
        <div class="status-eyebrow">A che punto siamo</div>
        <div class="status-title" id="workTitle">—</div>
        <div class="status-desc" id="workDesc">—</div>
        <span class="status-pill" id="workPill">—</span>
      </div>

      <div class="section-title">Documenti e aggiornamenti</div>
      <div id="docList"></div>
    </div>
  </div>

  <!-- scheda: messaggi -->
  <div class="panel" id="panelMessaggi">
    <div class="messages" id="messages"></div>
    <div class="input-row">
      <input type="text" id="msgInput" placeholder="Scrivi un messaggio…">
      <button class="send" id="sendBtn" aria-label="Invia">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
/* ============ CONFIGURAZIONE ============
   Stessi valori dell'app principale. */
const SUPABASE_URL = "https://alxtmsfbxrkrevbioogv.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_cx-aRXg-ZCFDmsTfqBBccg_Li9rqqEa";

const supabaseClient = window.supabase
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

/* Il codice privato arriva dal link: cliente.html?c=XXXXX */
const accessCode = new URLSearchParams(window.location.search).get("c");

let conversation = null;
let clientInfo = null;
let messages = [];

function showGate(text){
  document.getElementById("gate").classList.remove("hidden");
  document.getElementById("gateText").textContent = text;
}
function hideGate(){
  document.getElementById("gate").classList.add("hidden");
}

function formatTime(iso){
  if(!iso) return "";
  const d = new Date(iso);
  const oggi = new Date();
  if(d.toDateString() === oggi.toDateString()){
    return d.getHours().toString().padStart(2,'0') + ":" + d.getMinutes().toString().padStart(2,'0');
  }
  return d.toLocaleDateString("it-IT", { day:"2-digit", month:"short" });
}

function initials(name){
  return (name || "").split(" ").map(w => w[0]).join("").slice(0,2).toUpperCase();
}

/* ---- Caricamento iniziale ---- */
async function init(){
  if(!accessCode){
    showGate("Questo link non è completo. Chiedi al tuo referente di rimandartelo.");
    return;
  }
  if(!supabaseClient){
    showGate("Non riesco a collegarmi. Controlla la connessione e riprova.");
    return;
  }

  try{
    /* Trova la conversazione dal codice privato del link */
    const { data: convs, error: convErr } = await supabaseClient
      .from("conversations").select("*").eq("access_code", accessCode).limit(1);

    if(convErr) throw convErr;
    if(!convs || convs.length === 0){
      showGate("Questo link non è più valido. Chiedi al tuo referente di rimandartelo.");
      return;
    }
    conversation = convs[0];

    /* Chi è il professionista */
    const { data: profile } = await supabaseClient
      .from("profiles").select("full_name, business_name, profession")
      .eq("id", conversation.owner_id).single();

    if(profile){
      const nome = profile.business_name || profile.full_name || "Il tuo referente";
      document.getElementById("proName").textContent = nome;
      document.getElementById("proAvatar").textContent = initials(nome);
      if(profile.full_name && profile.business_name){
        document.getElementById("proSub").textContent = profile.full_name;
      }
    }

    /* La scheda di questo cliente, per lo stato del lavoro */
    const { data: cls } = await supabaseClient
      .from("clients").select("*")
      .eq("owner_id", conversation.owner_id)
      .eq("name", conversation.contact_name).limit(1);
    clientInfo = cls && cls.length ? cls[0] : null;

    await loadMessages();
    renderWork();
    renderMessages();
    subscribeRealtime();
    hideGate();

  }catch(err){
    console.error("Errore apertura pagina cliente:", err);
    showGate("Non riesco ad aprire la pagina in questo momento. Riprova tra poco.");
  }
}

async function loadMessages(){
  const { data } = await supabaseClient
    .from("messages").select("*")
    .eq("conversation_id", conversation.id)
    .order("created_at", { ascending:true });
  messages = data || [];
}

/* ---- Scheda: il tuo lavoro ---- */
function renderWork(){
  const statusLabel = { attivo:"In corso", trattativa:"In valutazione", inattivo:"Concluso" };

  document.getElementById("workTitle").textContent =
    clientInfo ? clientInfo.name : conversation.contact_name;
  document.getElementById("workDesc").textContent =
    (clientInfo && clientInfo.description)
      ? clientInfo.description
      : "Qui vedrai gli aggiornamenti sul tuo lavoro man mano che procediamo.";

  const pill = document.getElementById("workPill");
  const st = clientInfo ? clientInfo.status : "attivo";
  pill.textContent = statusLabel[st] || "In corso";
  pill.className = "status-pill " + st;

  /* documenti e aggiornamenti: arrivano dai messaggi-evento della chat */
  const docs = messages.filter(m => m.event_type);
  const wrap = document.getElementById("docList");
  wrap.innerHTML = "";

  if(docs.length === 0){
    wrap.innerHTML = '<div class="empty"><b>Ancora nessun documento</b>Quando il tuo referente condividerà fatture, appuntamenti o aggiornamenti, li troverai qui.</div>';
    return;
  }

  const meta = {
    doc:   { color:"var(--indigo)", label:"Documento",
             svg:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M6 2h9l5 5v15H6z"/><path d="M15 2v5h5"/></svg>' },
    appt:  { color:"var(--amber)", label:"Appuntamento",
             svg:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>' },
    update:{ color:"var(--teal)", label:"Aggiornamento",
             svg:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h11"/></svg>' }
  };

  docs.slice().reverse().forEach(m => {
    const t = meta[m.event_type] || meta.update;
    const row = document.createElement("div");
    row.className = "doc-row";
    row.innerHTML = `
      <div class="doc-icon" style="background:${t.color};">${t.svg}</div>
      <div class="doc-body">
        <div class="doc-title">${m.title || t.label}</div>
        <div class="doc-sub">${m.body || ""} · ${formatTime(m.created_at)}</div>
      </div>
      ${m.amount ? '<div class="doc-amount">€' + Number(m.amount).toLocaleString("it-IT") + '</div>' : ''}
    `;
    wrap.appendChild(row);
  });
}

/* ---- Scheda: messaggi ---- */
function renderMessages(){
  const wrap = document.getElementById("messages");
  wrap.innerHTML = "";

  if(messages.length === 0){
    wrap.innerHTML = '<div class="empty"><b>Nessun messaggio</b>Scrivi qui sotto per parlare direttamente col tuo referente.</div>';
    return;
  }

  const eventIcons = {
    doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 2h9l5 5v15H6z"/><path d="M15 2v5h5"/></svg>',
    appt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
    update:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 11l3 3L22 4"/><path d="M21 12v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h11"/></svg>'
  };
  const eventLabel = { doc:"Documento", appt:"Appuntamento", update:"Aggiornamento" };

  messages.forEach(m => {
    if(m.event_type){
      const card = document.createElement("div");
      card.className = "chat-event";
      card.innerHTML = `
        <div class="chat-event-tag ${m.event_type}">${eventIcons[m.event_type] || ""}${eventLabel[m.event_type] || ""}</div>
        <div class="chat-event-title">${m.title || ""}</div>
        <div class="chat-event-text">${m.body || ""}</div>
        ${m.amount ? '<div class="chat-event-amount">€' + Number(m.amount).toLocaleString("it-IT") + '</div>' : ''}
        <span class="chat-event-time">${formatTime(m.created_at)}</span>
      `;
      wrap.appendChild(card);
      return;
    }
    const b = document.createElement("div");
    /* "me" nel database = il professionista. Per il cliente sta a sinistra. */
    b.className = "bubble " + (m.sender === "me" ? "pro" : "mine");
    b.innerHTML = (m.body || "") + '<span class="bubble-time">' + formatTime(m.created_at) + '</span>';
    wrap.appendChild(b);
  });

  wrap.scrollTop = wrap.scrollHeight;
}

/* ---- Invio messaggio ---- */
async function send(){
  const input = document.getElementById("msgInput");
  const val = input.value.trim();
  if(!val || !conversation) return;

  input.value = "";
  const { error } = await supabaseClient.from("messages").insert({
    conversation_id: conversation.id, sender: "them", body: val
  });

  if(error){
    console.error("Errore invio:", error.message);
    input.value = val;
    showGate("Il messaggio non è partito. Controlla la connessione e riprova.");
    setTimeout(hideGate, 2600);
  }
}

document.getElementById("sendBtn").addEventListener("click", send);
document.getElementById("msgInput").addEventListener("keydown", (e) => {
  if(e.key === "Enter") send();
});

/* ---- Realtime: i messaggi arrivano subito ---- */
function subscribeRealtime(){
  supabaseClient
    .channel("cliente-" + conversation.id)
    .on("postgres_changes",
      { event:"INSERT", schema:"public", table:"messages", filter:"conversation_id=eq." + conversation.id },
      (payload) => {
        if(messages.some(m => m.id === payload.new.id)) return;
        messages.push(payload.new);
        renderMessages();
        if(payload.new.event_type) renderWork();
      })
    .subscribe();
}

/* ---- Linguette ---- */
document.getElementById("tabLavoro").addEventListener("click", () => {
  document.getElementById("tabLavoro").classList.add("active");
  document.getElementById("tabMessaggi").classList.remove("active");
  document.getElementById("panelLavoro").classList.add("visible");
  document.getElementById("panelMessaggi").classList.remove("visible");
});
document.getElementById("tabMessaggi").addEventListener("click", () => {
  document.getElementById("tabMessaggi").classList.add("active");
  document.getElementById("tabLavoro").classList.remove("active");
  document.getElementById("panelMessaggi").classList.add("visible");
  document.getElementById("panelLavoro").classList.remove("visible");
  const wrap = document.getElementById("messages");
  wrap.scrollTop = wrap.scrollHeight;
});

init();
</script>
</body>
</html>
