<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2952CC">
<title>EON — Il tuo lavoro</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EON">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F7FC; --card:#FFFFFF;
    --border:rgba(20,30,60,.08); --border-strong:rgba(20,30,60,.15);
    --text:#0E1424; --muted:#5B6478; --faint:#98A0B4;
    --indigo:#2F5CF6; --indigo-soft:rgba(47,92,246,.09);
    --grad-blue:linear-gradient(135deg, #3E6BFF 0%, #2144D6 100%);
    --teal:#0E9F84; --teal-soft:rgba(14,159,132,.11);
    --amber:#C9860B; --amber-soft:rgba(201,134,11,.12);
    --green:#16A34A; --green-soft:rgba(22,163,74,.11);
    --coral:#E4572E; --coral-soft:rgba(228,87,46,.10);
    --shadow-sm:0 1px 2px rgba(20,23,29,.05), 0 1px 1px rgba(20,23,29,.04);
    --shadow-md:0 10px 30px rgba(20,23,29,.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ font-family:'Manrope', sans-serif; margin:0; }

  .app{
    max-width:460px; margin:0 auto; height:100%;
    display:flex; flex-direction:column;
    background:var(--card); box-shadow:0 0 60px rgba(20,23,29,.08);
  }

  /* intestazione con il nome del professionista */
  .head{
    padding:16px 18px calc(14px + 0px);
    border-bottom:1px solid var(--border); flex:none;
    display:flex; align-items:center; gap:12px;
  }
  .head-avatar{
    width:42px; height:42px; border-radius:50%; flex:none;
    background:var(--grad-blue); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-family:'Manrope'; font-weight:800; font-size:15px;
  }
  .head-name{ font-size:15.5px; font-weight:800; }
  .head-sub{ font-size:11.5px; color:var(--muted); margin-top:1px; }
  .head-logo{
    margin-left:auto; display:flex; align-items:center; gap:1px;
    font-family:'Manrope'; font-weight:900; font-size:15px; color:var(--faint);
  }
  .head-logo .o{
    width:14px; height:14px; border-radius:50%; margin:0 1px;
    background:var(--grad-blue); color:#fff;
    display:inline-flex; align-items:center; justify-content:center;
  }
  .head-logo .o svg{ width:9px; height:9px; }

  /* linguette: Lavoro / Messaggi */
  .tabs{ display:flex; gap:6px; padding:12px 14px; border-bottom:1px solid var(--border); flex:none; }
  .tab{
    flex:1; text-align:center; padding:10px; border-radius:12px; cursor:pointer;
    font-size:13px; font-weight:700; color:var(--muted); background:#FBFAF8;
    border:1px solid var(--border);
  }
  .tab.active{ background:var(--indigo-soft); color:var(--indigo); border-color:rgba(47,92,246,.4); }

  .panel{ flex:1; overflow-y:auto; display:none; }
  .panel.visible{ display:flex; flex-direction:column; }

  /* --- scheda Lavoro --- */
  .work{ padding:18px 16px 24px; }
  .status-card{
    background:var(--card); border:1.5px solid var(--border); border-radius:18px;
    padding:18px; box-shadow:var(--shadow-sm); margin-bottom:14px;
  }
  .status-eyebrow{ font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.07em; color:var(--faint); margin-bottom:8px; }
  .status-title{ font-size:18px; font-weight:900; letter-spacing:-.01em; margin-bottom:6px; }
  .status-desc{ font-size:13px; color:var(--muted); line-height:1.55; }
  .status-pill{
    display:inline-block; font-size:11.5px; font-weight:700;
    padding:5px 12px; border-radius:20px; margin-top:12px;
  }
  .status-pill.attivo{ background:var(--green-soft); color:var(--green); }
  .status-pill.trattativa{ background:var(--amber-soft); color:var(--amber); }
  .status-pill.inattivo{ background:rgba(20,23,29,.05); color:var(--faint); }

  .section-title{
    font-size:11.5px; font-weight:800; text-transform:uppercase; letter-spacing:.06em;
    color:var(--faint); margin:20px 0 10px 2px;
  }
  .doc-row{
    display:flex; align-items:center; gap:12px; padding:14px;
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    margin-bottom:9px; box-shadow:var(--shadow-sm);
  }
  .doc-icon{
    width:38px; height:38px; border-radius:12px; flex:none; color:#fff;
    display:flex; align-items:center; justify-content:center;
  }
  .doc-icon svg{ width:17px; height:17px; }
  .doc-body{ flex:1; min-width:0; }
  .doc-title{ font-size:13.5px; font-weight:700; }
  .doc-sub{ font-size:11.5px; color:var(--muted); margin-top:2px; }
  .doc-amount{ font-family:'Manrope'; font-size:14px; font-weight:800; flex:none; }

  .empty{
    text-align:center; padding:30px 20px; color:var(--muted);
    font-size:13px; line-height:1.6;
  }
  .empty b{ display:block; color:var(--text); font-size:14px; margin-bottom:5px; }

  /* --- scheda Messaggi --- */
  .messages{ flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:9px; }
  .bubble{ max-width:76%; padding:10px 14px; border-radius:17px; font-size:14px; line-height:1.45; }
  /* dal punto di vista del cliente i ruoli sono invertiti:
     "me" del professionista arriva a sinistra, "them" (il cliente) a destra */
  .bubble.pro{ background:#F1F0EC; color:var(--text); align-self:flex-start; border-bottom-left-radius:4px; }
  .bubble.mine{ background:var(--grad-blue); color:#fff; align-self:flex-end; border-bottom-right-radius:4px; font-weight:500; }
  .bubble-time{ font-size:10px; opacity:.65; margin-top:4px; display:block; }

  .chat-event{
    align-self:flex-start; max-width:86%; background:var(--card); border:1px solid var(--border);
    border-radius:16px; border-bottom-left-radius:4px; box-shadow:var(--shadow-sm); padding:11px 13px;
  }
  .chat-event-tag{
    display:inline-flex; align-items:center; gap:5px; font-size:9.5px; font-weight:800;
    text-transform:uppercase; letter-spacing:.04em; padding:3px 8px; border-radius:20px; margin-bottom:6px;
  }
  .chat-event-tag.doc{ background:var(--indigo-soft); color:var(--indigo); }
  .chat-event-tag.appt{ background:var(--amber-soft); color:var(--amber); }
  .chat-event-tag.update{ background:var(--teal-soft); color:var(--teal); }
  .chat-event-tag svg{ width:9px; height:9px; }
  .chat-event-title{ font-size:13px; font-weight:700; margin-bottom:1px; }
  .chat-event-text{ font-size:12px; color:var(--muted); line-height:1.45; }
  .chat-event-amount{ font-size:14.5px; font-weight:900; margin-top:5px; }
  .chat-event-time{ font-size:9.5px; opacity:.55; margin-top:5px; display:block; }

  /* allegati */
  .attach{
    width:44px; height:44px; border-radius:50%; flex:none; border:none; cursor:pointer;
    background:rgba(20,23,29,.05); color:var(--muted);
    display:flex; align-items:center; justify-content:center;
  }
  .attach:hover{ background:rgba(20,23,29,.09); color:var(--indigo); }
  .attach svg{ width:20px; height:20px; }
  .attach:disabled{ opacity:.4; cursor:not-allowed; }

  .upload-bar{ padding:10px 16px; border-top:1px solid var(--border); flex:none; }
  .upload-text{ font-size:11.5px; color:var(--muted); margin-bottom:6px; font-weight:600; }
  .upload-track{ height:5px; border-radius:20px; background:rgba(20,23,29,.07); overflow:hidden; }
  .upload-fill{ height:100%; width:0%; border-radius:20px; background:var(--grad-blue); transition:width .25s; }

  .msg-media{
    width:74%; max-width:280px; flex:none;
    border-radius:16px; overflow:hidden; cursor:pointer; line-height:0;
    box-shadow:var(--shadow-sm); border:1px solid var(--border);
  }
  .msg-media.mine{ align-self:flex-end; border-bottom-right-radius:4px; }
  .msg-media.pro{ align-self:flex-start; border-bottom-left-radius:4px; }
  .msg-media img, .msg-media video{ width:100%; display:block; height:auto; min-height:120px; max-height:340px; object-fit:cover; background:#0E1424; }
  .msg-media-time{ font-size:10px; color:var(--muted); padding:5px 10px 7px; background:var(--card); line-height:1.2; display:block; }

  .msg-doc{
    display:flex; align-items:center; gap:11px; max-width:80%; flex:none;
    padding:11px 13px; border-radius:16px; cursor:pointer;
    background:var(--card); border:1px solid var(--border); box-shadow:var(--shadow-sm);
  }
  .msg-doc.mine{ align-self:flex-end; border-bottom-right-radius:4px; }
  .msg-doc.pro{ align-self:flex-start; border-bottom-left-radius:4px; }
  .msg-doc-icon{
    width:36px; height:36px; border-radius:11px; flex:none; color:#fff;
    background:var(--indigo); display:flex; align-items:center; justify-content:center;
  }
  .msg-doc-icon svg{ width:16px; height:16px; }
  .msg-doc-body{ min-width:0; }
  .msg-doc-name{ font-size:13px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .msg-doc-sub{ font-size:11px; color:var(--muted); margin-top:2px; }

  .media-viewer{
    position:fixed; inset:0; z-index:9999; background:rgba(10,12,18,.93);
    display:flex; align-items:center; justify-content:center; padding:16px;
  }
  .media-viewer img, .media-viewer video{ max-width:100%; max-height:82vh; border-radius:12px; }
  .media-viewer-close{
    position:absolute; top:calc(16px + env(safe-area-inset-top,0px)); right:16px;
    width:38px; height:38px; border-radius:50%; border:none; cursor:pointer;
    background:rgba(255,255,255,.15); color:#fff;
    display:flex; align-items:center; justify-content:center;
  }
  .media-viewer-close svg{ width:18px; height:18px; }

  .mic{
    width:44px; height:44px; border-radius:50%; flex:none; border:none; cursor:pointer;
    background:rgba(20,23,29,.05); color:var(--muted);
    display:flex; align-items:center; justify-content:center;
  }
  .mic:hover{ background:rgba(20,23,29,.09); color:var(--indigo); }
  .mic svg{ width:20px; height:20px; }
  .mic.recording{ background:var(--coral); color:#fff; animation:micPulse 1.4s ease-in-out infinite; }
  @keyframes micPulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(228,87,46,.5); }
    50%{ box-shadow:0 0 0 12px rgba(228,87,46,0); }
  }
  .rec-timer{ display:none; align-items:center; gap:7px; flex:1; font-size:13px; font-weight:700; color:var(--coral); }
  .rec-timer.on{ display:flex; }
  .rec-dot{ width:9px; height:9px; border-radius:50%; background:var(--coral); animation:micPulse 1.2s infinite; }

  .msg-audio{
    max-width:82%; padding:11px 13px; border-radius:16px; flex:none;
    background:var(--card); border:1px solid var(--border); box-shadow:var(--shadow-sm);
  }
  .msg-audio.mine{ align-self:flex-end; border-bottom-right-radius:4px; }
  .msg-audio.pro{ align-self:flex-start; border-bottom-left-radius:4px; }
  .msg-audio audio{ width:100%; height:38px; display:block; }
  .msg-audio-text{ font-size:12.5px; line-height:1.5; margin-top:9px; padding-top:9px; border-top:1px dashed var(--border); }
  .msg-audio-text.pending{ color:var(--faint); font-style:italic; }
  .msg-audio-time{ font-size:10px; color:var(--faint); margin-top:6px; display:block; }

  .input-row{
    display:flex; gap:9px; padding:12px 14px calc(12px + env(safe-area-inset-bottom, 0px));
    border-top:1px solid var(--border); flex:none; background:var(--card);
  }
  .input-row input{
    flex:1; border:1px solid var(--border); background:#FBFAF8;
    border-radius:20px; padding:12px 16px; font-size:14px; color:var(--text); font-family:inherit;
  }
  .input-row input:focus{ outline:2px solid var(--indigo); outline-offset:1px; }
  .send{
    width:44px; height:44px; border-radius:50%; flex:none; border:none; cursor:pointer;
    background:var(--grad-blue); color:#fff;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 12px rgba(47,92,246,.3);
  }
  .send svg{ width:18px; height:18px; }

  /* schermata di caricamento / errore */
  .gate{
    position:fixed; inset:0; background:var(--bg); z-index:20;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:30px; text-align:center; max-width:460px; margin:0 auto;
  }
  .gate.hidden{ display:none; }
  .gate-logo{
    display:flex; align-items:center; gap:2px;
    font-family:'Manrope'; font-weight:900; font-size:34px; margin-bottom:16px;
  }
  .gate-logo .o{
    width:27px; height:27px; border-radius:50%; margin:0 1px;
    background:var(--grad-blue); color:#fff;
    display:inline-flex; align-items:center; justify-content:center;
  }
  .gate-logo .o svg{ width:16px; height:16px; }
  .gate-text{ font-size:13.5px; color:var(--muted); line-height:1.6; max-width:300px; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-logo">
    <span>E</span>
    <span class="o"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9.5"/><path d="M12 7.2v5l3.6 2.1" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <span>N</span>
  </div>
  <div class="gate-text" id="gateText">Un attimo, sto aprendo la tua pagina…</div>
</div>

<div class="app">
  <div class="head">
    <div class="head-avatar" id="proAvatar">–</div>
    <div>
      <div class="head-name" id="proName">—</div>
      <div class="head-sub" id="proSub">Il tuo referente</div>
    </div>
    <div class="head-logo">
      <span>E</span>
      <span class="o"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="9.5"/><path d="M12 7.2v5l3.6 2.1" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span>N</span>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" id="tabLavoro">Il tuo lavoro</div>
    <div class="tab" id="tabMessaggi">Messaggi</div>
  </div>

  <!-- scheda: il tuo lavoro -->
  <div class="panel visible" id="panelLavoro">
    <div class="work">
      <div class="status-card">
        <div class="status-eyebrow">A che punto siamo</div>
        <div class="status-title" id="workTitle">—</div>
        <div class="status-desc" id="workDesc">—</div>
        <span class="status-pill" id="workPill">—</span>
      </div>

      <div class="section-title">Documenti e aggiornamenti</div>
      <div id="docList"></div>
    </div>
  </div>

  <!-- scheda: messaggi -->
  <div class="panel" id="panelMessaggi">
    <div class="messages" id="messages"></div>
    <div class="upload-bar" id="uploadBar" style="display:none;">
      <div class="upload-text" id="uploadText">Sto caricando…</div>
      <div class="upload-track"><div class="upload-fill" id="uploadFill"></div></div>
    </div>
    <div class="input-row">
      <button class="attach" id="attachBtn" aria-label="Allega foto, video o documento">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21.4 11.05L12.25 20.2a5.5 5.5 0 0 1-7.78-7.78l9.19-9.19a3.67 3.67 0 0 1 5.18 5.18l-9.2 9.2a1.83 1.83 0 0 1-2.59-2.59l8.49-8.48"/></svg>
      </button>
      <input type="file" id="fileInput" accept="image/*,video/*,.pdf,.doc,.docx,.xls,.xlsx" style="display:none;">
      <input type="text" id="msgInput" placeholder="Scrivi un messaggio…">
      <div class="rec-timer" id="recTimer">
        <span class="rec-dot"></span><span id="recTimerText">0:00</span>
        <span style="font-weight:500;color:var(--muted);font-size:11.5px;">tocca per inviare</span>
      </div>
      <button class="mic" id="micBtn" aria-label="Registra un vocale">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>
      <button class="send" id="sendBtn" aria-label="Invia">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
/* ============ CONFIGURAZIONE ============
   Stessi valori dell'app principale. */
const SUPABASE_URL = "https://alxtmsfbxrkrevbioogv.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_cx-aRXg-ZCFDmsTfqBBccg_Li9rqqEa";

const supabaseClient = window.supabase
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

/* Il codice privato arriva dal link: cliente.html?c=XXXXX */
const accessCode = new URLSearchParams(window.location.search).get("c");

let conversation = null;
let clientInfo = null;
let messages = [];

function showGate(text){
  document.getElementById("gate").classList.remove("hidden");
  document.getElementById("gateText").textContent = text;
}
function hideGate(){
  document.getElementById("gate").classList.add("hidden");
}

function formatTime(iso){
  if(!iso) return "";
  const d = new Date(iso);
  const oggi = new Date();
  if(d.toDateString() === oggi.toDateString()){
    return d.getHours().toString().padStart(2,'0') + ":" + d.getMinutes().toString().padStart(2,'0');
  }
  return d.toLocaleDateString("it-IT", { day:"2-digit", month:"short" });
}

function initials(name){
  return (name || "").split(" ").map(w => w[0]).join("").slice(0,2).toUpperCase();
}

/* ---- Caricamento iniziale ---- */
async function init(){
  if(!accessCode){
    showGate("Questo link non è completo. Chiedi al tuo referente di rimandartelo.");
    return;
  }
  if(!supabaseClient){
    showGate("Non riesco a collegarmi. Controlla la connessione e riprova.");
    return;
  }

  try{
    /* Trova la conversazione dal codice privato del link */
    const { data: convs, error: convErr } = await supabaseClient
      .from("conversations").select("*").eq("access_code", accessCode).limit(1);

    if(convErr) throw convErr;
    if(!convs || convs.length === 0){
      showGate("Questo link non è più valido. Chiedi al tuo referente di rimandartelo.");
      return;
    }
    conversation = convs[0];

    /* Chi è il professionista */
    const { data: profile } = await supabaseClient
      .from("profiles").select("full_name, business_name, profession")
      .eq("id", conversation.owner_id).single();

    if(profile){
      const nome = profile.business_name || profile.full_name || "Il tuo referente";
      document.getElementById("proName").textContent = nome;
      document.getElementById("proAvatar").textContent = initials(nome);
      if(profile.full_name && profile.business_name){
        document.getElementById("proSub").textContent = profile.full_name;
      }
    }

    /* La scheda di questo cliente, per lo stato del lavoro */
    const { data: cls } = await supabaseClient
      .from("clients").select("*")
      .eq("owner_id", conversation.owner_id)
      .eq("name", conversation.contact_name).limit(1);
    clientInfo = cls && cls.length ? cls[0] : null;

    await loadMessages();
    renderWork();
    renderMessages();
    subscribeRealtime();
    hideGate();

  }catch(err){
    console.error("Errore apertura pagina cliente:", err);
    showGate("Non riesco ad aprire la pagina in questo momento. Riprova tra poco.");
  }
}

async function loadMessages(){
  const { data } = await supabaseClient
    .from("messages").select("*")
    .eq("conversation_id", conversation.id)
    .order("created_at", { ascending:true });
  messages = data || [];
}

/* ---- Scheda: il tuo lavoro ---- */
function renderWork(){
  const statusLabel = { attivo:"In corso", trattativa:"In valutazione", inattivo:"Concluso" };

  document.getElementById("workTitle").textContent =
    clientInfo ? clientInfo.name : conversation.contact_name;
  document.getElementById("workDesc").textContent =
    (clientInfo && clientInfo.description)
      ? clientInfo.description
      : "Qui vedrai gli aggiornamenti sul tuo lavoro man mano che procediamo.";

  const pill = document.getElementById("workPill");
  const st = clientInfo ? clientInfo.status : "attivo";
  pill.textContent = statusLabel[st] || "In corso";
  pill.className = "status-pill " + st;

  /* documenti e aggiornamenti: arrivano dai messaggi-evento della chat */
  const docs = messages.filter(m => m.event_type);
  const wrap = document.getElementById("docList");
  wrap.innerHTML = "";

  if(docs.length === 0){
    wrap.innerHTML = '<div class="empty"><b>Ancora nessun documento</b>Quando il tuo referente condividerà fatture, appuntamenti o aggiornamenti, li troverai qui.</div>';
    return;
  }

  const meta = {
    doc:   { color:"var(--indigo)", label:"Documento",
             svg:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M6 2h9l5 5v15H6z"/><path d="M15 2v5h5"/></svg>' },
    appt:  { color:"var(--amber)", label:"Appuntamento",
             svg:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>' },
    update:{ color:"var(--teal)", label:"Aggiornamento",
             svg:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h11"/></svg>' }
  };

  docs.slice().reverse().forEach(m => {
    const t = meta[m.event_type] || meta.update;
    const row = document.createElement("div");
    row.className = "doc-row";
    row.innerHTML = `
      <div class="doc-icon" style="background:${t.color};">${t.svg}</div>
      <div class="doc-body">
        <div class="doc-title">${m.title || t.label}</div>
        <div class="doc-sub">${m.body || ""} · ${formatTime(m.created_at)}</div>
      </div>
      ${m.amount ? '<div class="doc-amount">€' + Number(m.amount).toLocaleString("it-IT") + '</div>' : ''}
    `;
    wrap.appendChild(row);
  });
}

/* ---- Scheda: messaggi ---- */
function renderMessages(){
  const wrap = document.getElementById("messages");
  wrap.innerHTML = "";

  if(messages.length === 0){
    wrap.innerHTML = '<div class="empty"><b>Nessun messaggio</b>Scrivi qui sotto per parlare direttamente col tuo referente.</div>';
    return;
  }

  const eventIcons = {
    doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 2h9l5 5v15H6z"/><path d="M15 2v5h5"/></svg>',
    appt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
    update:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 11l3 3L22 4"/><path d="M21 12v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h11"/></svg>'
  };
  const eventLabel = { doc:"Documento", appt:"Appuntamento", update:"Aggiornamento" };

  messages.forEach(m => {
    if(m.event_type){
      const card = document.createElement("div");
      card.className = "chat-event";
      card.innerHTML = `
        <div class="chat-event-tag ${m.event_type}">${eventIcons[m.event_type] || ""}${eventLabel[m.event_type] || ""}</div>
        <div class="chat-event-title">${m.title || ""}</div>
        <div class="chat-event-text">${m.body || ""}</div>
        ${m.amount ? '<div class="chat-event-amount">€' + Number(m.amount).toLocaleString("it-IT") + '</div>' : ''}
        <span class="chat-event-time">${formatTime(m.created_at)}</span>
      `;
      wrap.appendChild(card);
      return;
    }
    /* Allegati: foto e video si vedono, i documenti sono una riga */
    if(m.file_url){
      const lato = m.sender === "me" ? "pro" : "mine";

      /* Vocale: si ascolta, sotto la trascrizione */
      if(m.file_type && m.file_type.startsWith("audio/")){
        const a = document.createElement("div");
        a.className = "msg-audio " + lato;
        const tr = m.body && m.body.trim();
        a.innerHTML = `
          <audio src="${m.file_url}" controls preload="metadata"></audio>
          ${tr ? '<div class="msg-audio-text">' + tr + '</div>' : ''}
          <span class="msg-audio-time">${formatTime(m.created_at)}</span>
        `;
        wrap.appendChild(a);
        return;
      }

      if(m.file_type && m.file_type.startsWith("image/")){
        const w = document.createElement("div");
        w.className = "msg-media " + lato;
        w.innerHTML = `<img src="${m.file_url}" alt="${m.file_name || "Foto"}" loading="lazy"><span class="msg-media-time">${formatTime(m.created_at)}</span>`;
        w.addEventListener("click", () => apriMedia(m.file_url, m.file_type));
        wrap.appendChild(w);
        return;
      }
      if(m.file_type && m.file_type.startsWith("video/")){
        const w = document.createElement("div");
        w.className = "msg-media " + lato;
        w.innerHTML = `<video src="${m.file_url}" preload="metadata" playsinline></video><span class="msg-media-time">${formatTime(m.created_at)}</span>`;
        w.addEventListener("click", () => apriMedia(m.file_url, m.file_type));
        wrap.appendChild(w);
        return;
      }
      const d = document.createElement("div");
      d.className = "msg-doc " + lato;
      d.innerHTML = `
        <div class="msg-doc-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2h9l5 5v15H6z"/><path d="M15 2v5h5"/></svg></div>
        <div class="msg-doc-body">
          <div class="msg-doc-name">${m.file_name || "Documento"}</div>
          <div class="msg-doc-sub">Tocca per aprire · ${formatTime(m.created_at)}</div>
        </div>
      `;
      d.addEventListener("click", () => window.open(m.file_url, "_blank"));
      wrap.appendChild(d);
      return;
    }

    const b = document.createElement("div");
    /* "me" nel database = il professionista. Per il cliente sta a sinistra. */
    b.className = "bubble " + (m.sender === "me" ? "pro" : "mine");
    b.innerHTML = (m.body || "") + '<span class="bubble-time">' + formatTime(m.created_at) + '</span>';
    wrap.appendChild(b);
  });

  wrap.scrollTop = wrap.scrollHeight;
}

/* ---- Invio messaggio ---- */
async function send(){
  const input = document.getElementById("msgInput");
  const val = input.value.trim();
  if(!val || !conversation) return;

  input.value = "";
  const { error } = await supabaseClient.from("messages").insert({
    conversation_id: conversation.id, sender: "them", body: val
  });

  if(error){
    console.error("Errore invio:", error.message);
    input.value = val;
    showGate("Il messaggio non è partito. Controlla la connessione e riprova.");
    setTimeout(hideGate, 2600);
  }
}

document.getElementById("sendBtn").addEventListener("click", send);
document.getElementById("msgInput").addEventListener("keydown", (e) => {
  if(e.key === "Enter") send();
});

/* ---- Allegati: foto, video e documenti ---- */
const LIMITI = { foto: 10, video: 50, documento: 20 };

function tipoAllegato(file){
  if(file.type.startsWith("image/")) return "foto";
  if(file.type.startsWith("video/")) return "video";
  return "documento";
}
function pesoLeggibile(bytes){
  if(bytes < 1024 * 1024) return Math.round(bytes / 1024) + " KB";
  return (bytes / (1024 * 1024)).toFixed(1).replace(".", ",") + " MB";
}
function nomeFileSicuro(originale){
  const casuale = Math.random().toString(36).slice(2) + Date.now().toString(36);
  const est = (originale.split(".").pop() || "").toLowerCase().slice(0, 5);
  return casuale + (est ? "." + est : "");
}
function mostraCaricamento(testo, pct){
  const bar = document.getElementById("uploadBar");
  bar.style.display = testo ? "block" : "none";
  if(testo){
    document.getElementById("uploadText").textContent = testo;
    document.getElementById("uploadFill").style.width = (pct || 0) + "%";
  }
}

async function inviaAllegato(file){
  if(!conversation) return;
  const tipo = tipoAllegato(file);
  const limite = LIMITI[tipo];

  if(file.size > limite * 1024 * 1024){
    showGate(`Questo ${tipo} pesa ${pesoLeggibile(file.size)}, il massimo è ${limite} MB.`);
    setTimeout(hideGate, 3200);
    return;
  }

  const btn = document.getElementById("attachBtn");
  btn.disabled = true;
  mostraCaricamento("Sto inviando " + file.name + " (" + pesoLeggibile(file.size) + ")…", 20);

  try{
    const percorso = "clienti/" + conversation.id + "/" + nomeFileSicuro(file.name);
    mostraCaricamento("Sto inviando " + file.name + "…", 50);

    const { error: upErr } = await supabaseClient.storage
      .from("eon-files").upload(percorso, file, { contentType: file.type, upsert: false });
    if(upErr) throw upErr;

    mostraCaricamento("Quasi fatto…", 85);
    const { data: pub } = supabaseClient.storage.from("eon-files").getPublicUrl(percorso);

    const { error: msgErr } = await supabaseClient.from("messages").insert({
      conversation_id: conversation.id, sender: "them", body: "",
      file_url: pub.publicUrl, file_name: file.name, file_type: file.type
    });
    if(msgErr) throw msgErr;

    mostraCaricamento("", 100);
  }catch(err){
    console.error("Invio allegato non riuscito:", err);
    mostraCaricamento("", 0);
    showGate("Non sono riuscito a inviare il file. Controlla la connessione e riprova.");
    setTimeout(hideGate, 3000);
  }finally{
    btn.disabled = false;
    document.getElementById("fileInput").value = "";
  }
}

document.getElementById("attachBtn").addEventListener("click", () => {
  document.getElementById("fileInput").click();
});
document.getElementById("fileInput").addEventListener("change", (e) => {
  const f = e.target.files && e.target.files[0];
  if(f) inviaAllegato(f);
});

function apriMedia(url, tipo){
  const v = document.createElement("div");
  v.className = "media-viewer";
  v.innerHTML = (tipo || "").startsWith("video/")
    ? `<video src="${url}" controls autoplay playsinline></video>`
    : `<img src="${url}" alt="">`;
  const c = document.createElement("button");
  c.className = "media-viewer-close";
  c.setAttribute("aria-label", "Chiudi");
  c.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 6L6 18M6 6l12 12"/></svg>';
  c.addEventListener("click", () => v.remove());
  v.appendChild(c);
  v.addEventListener("click", (e) => { if(e.target === v) v.remove(); });
  document.body.appendChild(v);
}

/* ---- Vocali: si registrano, si ascoltano, vengono trascritti ---- */
let recorder = null, recChunks = [], recStart = 0, recTimer = null;
const MAX_SEC_VOCALE = 300;

function formattaDurata(sec){
  const m = Math.floor(sec / 60), s = sec % 60;
  return m + ":" + (s < 10 ? "0" : "") + s;
}
function uiRegistrazione(attiva){
  document.getElementById("micBtn").classList.toggle("recording", attiva);
  document.getElementById("msgInput").style.display = attiva ? "none" : "";
  document.getElementById("recTimer").classList.toggle("on", attiva);
}

async function avviaRegistrazione(){
  if(!navigator.mediaDevices || !window.MediaRecorder){
    showGate("Questo browser non permette di registrare audio.");
    setTimeout(hideGate, 2800);
    return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recChunks = [];
    const tipo = MediaRecorder.isTypeSupported("audio/mp4") ? "audio/mp4" : "audio/webm";
    recorder = new MediaRecorder(stream, { mimeType: tipo });

    recorder.ondataavailable = (e) => { if(e.data.size > 0) recChunks.push(e.data); };
    recorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      clearInterval(recTimer);
      uiRegistrazione(false);
      const durata = Math.round((Date.now() - recStart) / 1000);
      if(durata < 1 || recChunks.length === 0) return;
      await inviaVocale(new Blob(recChunks, { type: tipo }), tipo, durata);
    };

    recorder.start();
    recStart = Date.now();
    uiRegistrazione(true);
    recTimer = setInterval(() => {
      const sec = Math.round((Date.now() - recStart) / 1000);
      document.getElementById("recTimerText").textContent = formattaDurata(sec);
      if(sec >= MAX_SEC_VOCALE) fermaRegistrazione();
    }, 500);
  }catch(err){
    showGate("Per registrare un vocale serve il permesso del microfono.");
    setTimeout(hideGate, 3000);
  }
}

function fermaRegistrazione(){
  if(recorder && recorder.state === "recording") recorder.stop();
}

async function inviaVocale(blob, tipo, durata){
  if(!conversation) return;
  mostraCaricamento("Sto inviando il vocale (" + formattaDurata(durata) + ")…", 35);
  try{
    const est = tipo.includes("mp4") ? "m4a" : "webm";
    const percorso = "clienti/" + conversation.id + "/vocali/" +
      Math.random().toString(36).slice(2) + Date.now().toString(36) + "." + est;

    const { error: upErr } = await supabaseClient.storage
      .from("eon-files").upload(percorso, blob, { contentType: tipo, upsert: false });
    if(upErr) throw upErr;

    mostraCaricamento("Quasi fatto…", 80);
    const { data: pub } = supabaseClient.storage.from("eon-files").getPublicUrl(percorso);

    const { error: msgErr } = await supabaseClient.from("messages").insert({
      conversation_id: conversation.id, sender: "them", body: "",
      file_url: pub.publicUrl, file_name: "Vocale " + formattaDurata(durata), file_type: tipo
    });
    if(msgErr) throw msgErr;

    mostraCaricamento("", 100);
  }catch(err){
    console.error("Invio vocale non riuscito:", err);
    mostraCaricamento("", 0);
    showGate("Non sono riuscito a inviare il vocale. Riprova.");
    setTimeout(hideGate, 3000);
  }
}

document.getElementById("micBtn").addEventListener("click", () => {
  if(recorder && recorder.state === "recording") fermaRegistrazione();
  else avviaRegistrazione();
});

/* ---- Realtime: i messaggi arrivano subito ---- */
function subscribeRealtime(){
  supabaseClient
    .channel("cliente-" + conversation.id)
    .on("postgres_changes",
      { event:"INSERT", schema:"public", table:"messages", filter:"conversation_id=eq." + conversation.id },
      (payload) => {
        if(messages.some(m => m.id === payload.new.id)) return;
        messages.push(payload.new);
        renderMessages();
        if(payload.new.event_type) renderWork();
      })
    .subscribe();
}
