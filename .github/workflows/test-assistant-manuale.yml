name: Test manuale assistente AI

# Workflow temporaneo, solo su richiesta (mai automatico): accede con un
# account vero (via i secret EON_TEST_EMAIL / EON_TEST_PASSWORD), prova i
# cinque impegni dell'esempio, verifica che siano stati scritti davvero,
# prova il flusso di conferma su un'azione delicata (manda_messaggio) e
# infine ripulisce SOLO le righe create durante il test, tracciate per id
# — mai un "cancella tutto quello che appartiene a questo utente", perché
# qui l'utente è un account vero con dati veri.
on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: "Indirizzo del deployment di preview da testare (senza slash finale)"
        required: true
        default: "https://eonbeckend-git-claude-ciao-ipc3fm-gianardi1.vercel.app"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Nessun checkout: non serve alcun file del repository per questo
      # test. I due valori sotto sono pubblici (la chiave "anon" è pensata
      # per stare nel codice del browser, protetta dalle regole RLS), sono
      # già visibili in chiaro in index.html.
      - name: Configurazione (valori pubblici, presi da index.html)
        id: config
        run: |
          echo "supabase_url=https://alxtmsfbxrkrevbioogv.supabase.co" >> "$GITHUB_OUTPUT"
          echo "anon=sb_publishable_cx-aRXg-ZCFDmsTfqBBccg_Li9rqqEa" >> "$GITHUB_OUTPUT"

      - name: Accedi con l'account fornito
        id: login
        env:
          SUPABASE_URL: ${{ steps.config.outputs.supabase_url }}
          ANON_KEY: ${{ steps.config.outputs.anon }}
          EMAIL: ${{ secrets.EON_TEST_EMAIL }}
          PASSWORD: ${{ secrets.EON_TEST_PASSWORD }}
        run: |
          if [ -z "$EMAIL" ] || [ -z "$PASSWORD" ]; then
            echo "::error::Mancano i secret EON_TEST_EMAIL e/o EON_TEST_PASSWORD (Settings → Secrets and variables → Actions)."
            echo "puo_procedere=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RESP=$(curl -sS -X POST "$SUPABASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $ANON_KEY" -H "Content-Type: application/json" \
            -d "{\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\"}")

          TOKEN=$(echo "$RESP" | jq -r '.access_token // empty')
          if [ -z "$TOKEN" ]; then
            echo "::error::Login non riuscito: $(echo "$RESP" | jq -r '.error_description // .msg // "risposta non valida"')"
            echo "puo_procedere=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "puo_procedere=si" >> "$GITHUB_OUTPUT"
          echo "Login riuscito."

      - name: "Test 1 — cinque impegni in una frase (nomi chiaramente finti, per non toccare clienti veri)"
        if: steps.login.outputs.puo_procedere == 'si'
        id: impegni
        env:
          TOKEN: ${{ steps.login.outputs.token }}
          PREVIEW_URL: ${{ inputs.preview_url }}
        run: |
          RESP=$(curl -sS -X POST "$PREVIEW_URL/api?action=assistant" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{"messaggio":"Segnare lunedì ZZZ-test-contatto-9001 pagamento mensile di prova. Aggiornare pratica ZZZ-test-AML-9002. Chiamare ZZZ-test-numero-9003 alle 17:00. Comprare ZZZ-test-materiale-9004. Martedì sopralluogo ZZZ-test-9005 alle 19:00."}')
          echo "$RESP" | jq . || echo "$RESP"

          N=$(echo "$RESP" | jq '[.azioni[]? | select(.tool=="crea_impegno")] | length')
          echo "Impegni creati secondo la risposta: $N (attesi: 5)"
          echo "stato=$(echo "$RESP" | jq -r '.stato')" >> "$GITHUB_OUTPUT"

          # Id esatti creati, per la pulizia mirata a fine test — MAI un
          # cancella-tutto su un account con dati veri.
          IDS=$(echo "$RESP" | jq -r '[.azioni[]? | select(.tool=="crea_impegno") | .esito.id] | join(",")')
          echo "task_ids=$IDS" >> "$GITHUB_OUTPUT"
          echo "Id creati (da ripulire a fine test): $IDS"

      - name: "Verifica su Supabase — i task esistono davvero"
        if: steps.login.outputs.puo_procedere == 'si' && steps.impegni.outputs.task_ids != ''
        env:
          SUPABASE_URL: ${{ steps.config.outputs.supabase_url }}
          ANON_KEY: ${{ steps.config.outputs.anon }}
          TOKEN: ${{ steps.login.outputs.token }}
          TASK_IDS: ${{ steps.impegni.outputs.task_ids }}
        run: |
          curl -sS "$SUPABASE_URL/rest/v1/tasks?select=id,title,time,scheduled_at&id=in.($TASK_IDS)" \
            -H "apikey: $ANON_KEY" -H "Authorization: Bearer $TOKEN" | jq . || true

      - name: "Test 2 — crea un cliente di prova (per testare la conferma)"
        if: steps.login.outputs.puo_procedere == 'si'
        id: cliente
        env:
          TOKEN: ${{ steps.login.outputs.token }}
          PREVIEW_URL: ${{ inputs.preview_url }}
        run: |
          # Passiamo dal backend (api/index.js), non da Supabase diretto:
          # è lui che aggiunge correttamente owner_id, esattamente come
          # farebbe l'app vera. Nome inequivocabilmente di test.
          RESP=$(curl -sS -X POST "$PREVIEW_URL/api?resource=clients" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"name":"ZZZ-TEST-CANCELLARE-9099","status":"attivo"}')
          echo "$RESP" | jq . || echo "$RESP"
          ID=$(echo "$RESP" | jq -r '.data[0].id // empty')
          echo "cliente_id=$ID" >> "$GITHUB_OUTPUT"

      - name: "Test 3 — un'azione delicata deve chiedere conferma, non eseguire subito"
        if: steps.login.outputs.puo_procedere == 'si' && steps.cliente.outputs.cliente_id != ''
        id: delicata
        env:
          TOKEN: ${{ steps.login.outputs.token }}
          PREVIEW_URL: ${{ inputs.preview_url }}
        run: |
          RESP=$(curl -sS -X POST "$PREVIEW_URL/api?action=assistant" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{"messaggio":"Manda un messaggio a ZZZ-TEST-CANCELLARE-9099 dicendogli: ciao, è un test."}')
          echo "$RESP" | jq . || echo "$RESP"

          STATO=$(echo "$RESP" | jq -r '.stato')
          echo "Stato ricevuto: $STATO (atteso: in_attesa_conferma)"
          echo "run_id=$(echo "$RESP" | jq -r '.runId // empty')" >> "$GITHUB_OUTPUT"

      - name: "Test 4 — conferma l'azione e verifica che parta"
        if: steps.delicata.outputs.run_id != ''
        id: conferma
        env:
          TOKEN: ${{ steps.login.outputs.token }}
          PREVIEW_URL: ${{ inputs.preview_url }}
          RUN_ID: ${{ steps.delicata.outputs.run_id }}
        run: |
          RESP=$(curl -sS -X POST "$PREVIEW_URL/api?action=assistant" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "{\"runId\":\"$RUN_ID\",\"conferma\":true}")
          echo "$RESP" | jq . || echo "$RESP"
          echo "messaggio_id=$(echo "$RESP" | jq -r '[.azioni[]? | select(.tool=="manda_messaggio")][0].esito.id // empty')" >> "$GITHUB_OUTPUT"

      - name: "Test 5 — un secondo tentativo con lo stesso runId non deve rieseguire"
        if: steps.delicata.outputs.run_id != ''
        env:
          TOKEN: ${{ steps.login.outputs.token }}
          PREVIEW_URL: ${{ inputs.preview_url }}
          RUN_ID: ${{ steps.delicata.outputs.run_id }}
        run: |
          CODE=$(curl -sS -o /tmp/replay.json -w "%{http_code}" -X POST "$PREVIEW_URL/api?action=assistant" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "{\"runId\":\"$RUN_ID\",\"conferma\":true}")
          echo "Codice HTTP replay: $CODE (atteso: 409)"
          cat /tmp/replay.json | jq . || cat /tmp/replay.json

      # ------------------------------------------------------------
      # Test 6-10: analisi della chat (action=analizza_messaggio e
      # action=rispondi_richiesta_cliente). Prima questa logica girava
      # nel frontend; qui verifichiamo che, spostata sul backend, si
      # comporti come prima nei casi che la revisione del codice ha
      # trattato con più attenzione: chi propone/chi conferma, la
      # richiesta di decisione quando è il cliente a chiedere uno
      # spostamento o un annullamento, e il promemoria silenzioso per
      # le risposte rimaste in sospeso.
      #
      # Nota: questi test chiamano davvero Claude per interpretare la
      # conversazione (non solo tool calling deterministico): come per
      # il Test 1, stampano atteso/ottenuto ma non fanno fallire la job
      # su un singolo disaccordo di interpretazione — vanno letti da
      # una persona, specie se qualcosa non torna.
      # ------------------------------------------------------------

      - name: "Test 6 — analisi chat: appuntamento nuovo proposto e confermato"
        if: steps.login.outputs.puo_procedere == 'si'
        id: analisi_nuovo
        env:
          TOKEN: ${{ steps.login.outputs.token }}
          PREVIEW_URL: ${{ inputs.preview_url }}
        run: |
          CONV=$(curl -sS -X POST "$PREVIEW_URL/api?resource=conversations" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{"contact_name":"ZZZ-TEST-ANALISI-NUOVO-9201","is_client":true,"is_prospect":false}' \
            | jq -r '.data[0].id // empty')
          echo "conv_id=$CONV" >> "$GITHUB_OUTPUT"
          [ -z "$CONV" ] && { echo "::error::Conversazione di test non creata"; exit 0; }

          curl -sS -X POST "$PREVIEW_URL/api?resource=messages" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "{\"conversation_id\":\"$CONV\",\"sender\":\"me\",\"body\":\"Possiamo vederci martedì alle 16 per il preventivo?\"}" > /dev/null
          curl -sS -X POST "$PREVIEW_URL/api?resource=messages" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "{\"conversation_id\":\"$CONV\",\"sender\":\"them\",\"body\":\"Ok perfetto, ci vediamo allora\"}" > /dev/null

          RESP=$(curl -sS -X POST "$PREVIEW_URL/api?action=analizza_messaggio" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "{\"conversation_id\":\"$CONV\"}")
          echo "$RESP" | jq . || echo "$RESP"
          N=$(echo "$RESP" | jq '[.azioni[]? | select(.tool=="crea_impegno")] | length')
          echo "Appuntamenti creati secondo la risposta: $N (atteso: 1)"

      - name: "Test 7 — analisi chat: proposta del cliente non ancora confermata, nessuna azione automatica"
        if: steps.login.outputs.puo_procedere == 'si'
        id: analisi_proposta
        env:
          TOKEN: ${{ steps.login.outputs.token }}
          PREVIEW_URL: ${{ inputs.preview_url }}
        run: |
          CONV=$(curl -sS -X POST "$PREVIEW_URL/api?resource=conversations" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{"contact_name":"ZZZ-TEST-ANALISI-PROPOSTA-9202","is_client":true,"is_prospect":false}' \
            | jq -r '.data[0].id // empty')
          echo "conv_id=$CONV" >> "$GITHUB_OUTPUT"
          [ -z "$CONV" ] && { echo "::error::Conversazione di test non creata"; exit 0; }

          curl -sS -X POST "$PREVIEW_URL/api?resource=messages" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "{\"conversation_id\":\"$CONV\",\"sender\":\"them\",\"body\":\"Ciao, possiamo vederci giovedì alle 10 per parlare del progetto?\"}" > /dev/null

          RESP=$(curl -sS -X POST "$PREVIEW_URL/api?action=analizza_messaggio" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "{\"conversation_id\":\"$CONV\"}")
          echo "$RESP" | jq . || echo "$RESP"
          N=$(echo "$RESP" | jq '.azioni | length')
          echo "Azioni eseguite: $N (atteso: 0, deve aspettare che risponda il professionista)"

      - name: "Test 8 — analisi chat: il cliente chiede di spostare, il professionista conferma"
        if: steps.login.outputs.puo_procedere == 'si'
        id: analisi_sposta
        env:
          TOKEN: ${{ steps.login.outputs.token }}
          PREVIEW_URL: ${{ inputs.preview_url }}
        run: |
          CONV=$(curl -sS -X POST "$PREVIEW_URL/api?resource=conversations" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{"contact_name":"ZZZ-TEST-ANALISI-SPOSTA-9203","is_client":true,"is_prospect":false}' \
            | jq -r '.data[0].id // empty')
          echo "conv_id=$CONV" >> "$GITHUB_OUTPUT"
          [ -z "$CONV" ] && { echo "::error::Conversazione di test non creata"; exit 0; }

          QUANDO=$(date -u -d '+5 days 15:00' +"%Y-%m-%dT%H:%M:%S")
          APPT=$(curl -sS -X POST "$PREVIEW_URL/api?resource=messages" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "{\"conversation_id\":\"$CONV\",\"sender\":\"me\",\"event_type\":\"appt\",\"title\":\"Sopralluogo\",\"body\":\"$QUANDO\",\"scheduled_at\":\"$QUANDO\"}" \
            | jq -r '.data[0].id // empty')
          echo "appt_id=$APPT" >> "$GITHUB_OUTPUT"
          [ -z "$APPT" ] && { echo "::error::Appuntamento di test non creato"; exit 0; }

          curl -sS -X POST "$PREVIEW_URL/api?resource=messages" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "{\"conversation_id\":\"$CONV\",\"sender\":\"them\",\"body\":\"Possiamo spostare il sopralluogo alle 17 invece che alle 15?\"}" > /dev/null

          RESP=$(curl -sS -X POST "$PREVIEW_URL/api?action=analizza_messaggio" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "{\"conversation_id\":\"$CONV\"}")
          echo "$RESP" | jq . || echo "$RESP"
          AZIONE=$(echo "$RESP" | jq -r '.richiesta_decisione.azione // empty')
          RIFERITO=$(echo "$RESP" | jq -r '.richiesta_decisione.riferito_id // empty')
          QUANDO_NUOVO=$(echo "$RESP" | jq -r '.richiesta_decisione.quando_nuovo_iso // empty')
          echo "Richiesta di decisione: azione=$AZIONE (atteso: sposta), riferito=$RIFERITO (atteso: $APPT)"

          CONFRESP=$(curl -sS -X POST "$PREVIEW_URL/api?action=rispondi_richiesta_cliente" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "{\"conversation_id\":\"$CONV\",\"riferito_id\":\"$APPT\",\"azione\":\"sposta\",\"conferma\":true,\"quando_nuovo_iso\":\"$QUANDO_NUOVO\"}")
          echo "$CONFRESP" | jq . || echo "$CONFRESP"
          echo "Confermato: $(echo "$CONFRESP" | jq -r '.confermato') (atteso: true)"

      - name: "Test 9 — analisi chat: il cliente chiede di annullare, il professionista rifiuta"
        if: steps.login.outputs.puo_procedere == 'si'
        id: analisi_annulla
        env:
          TOKEN: ${{ steps.login.outputs.token }}
          PREVIEW_URL: ${{ inputs.preview_url }}
        run: |
          CONV=$(curl -sS -X POST "$PREVIEW_URL/api?resource=conversations" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{"contact_name":"ZZZ-TEST-ANALISI-ANNULLA-9204","is_client":true,"is_prospect":false}' \
            | jq -r '.data[0].id // empty')
          echo "conv_id=$CONV" >> "$GITHUB_OUTPUT"
          [ -z "$CONV" ] && { echo "::error::Conversazione di test non creata"; exit 0; }

          QUANDO=$(date -u -d '+6 days 11:00' +"%Y-%m-%dT%H:%M:%S")
          APPT=$(curl -sS -X POST "$PREVIEW_URL/api?resource=messages" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "{\"conversation_id\":\"$CONV\",\"sender\":\"me\",\"event_type\":\"appt\",\"title\":\"Chiamata di aggiornamento\",\"body\":\"$QUANDO\",\"scheduled_at\":\"$QUANDO\"}" \
            | jq -r '.data[0].id // empty')
          echo "appt_id=$APPT" >> "$GITHUB_OUTPUT"
          [ -z "$APPT" ] && { echo "::error::Appuntamento di test non creato"; exit 0; }

          curl -sS -X POST "$PREVIEW_URL/api?resource=messages" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "{\"conversation_id\":\"$CONV\",\"sender\":\"them\",\"body\":\"Devo disdire l'appuntamento, non riesco più a venire\"}" > /dev/null

          RESP=$(curl -sS -X POST "$PREVIEW_URL/api?action=analizza_messaggio" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "{\"conversation_id\":\"$CONV\"}")
          echo "$RESP" | jq . || echo "$RESP"
          AZIONE=$(echo "$RESP" | jq -r '.richiesta_decisione.azione // empty')
          echo "Richiesta di decisione: azione=$AZIONE (atteso: annulla)"

          RIFRESP=$(curl -sS -X POST "$PREVIEW_URL/api?action=rispondi_richiesta_cliente" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "{\"conversation_id\":\"$CONV\",\"riferito_id\":\"$APPT\",\"azione\":\"annulla\",\"conferma\":false}")
          echo "$RIFRESP" | jq . || echo "$RIFRESP"
          echo "Confermato: $(echo "$RIFRESP" | jq -r '.confermato') (atteso: false, il professionista ha rifiutato)"

      - name: "Test 10 — analisi chat: risposta rimasta in sospeso -> promemoria, poi conferma -> promemoria tolto"
        if: steps.login.outputs.puo_procedere == 'si'
        id: analisi_promemoria
        env:
          SUPABASE_URL: ${{ steps.config.outputs.supabase_url }}
          ANON_KEY: ${{ steps.config.outputs.anon }}
          TOKEN: ${{ steps.login.outputs.token }}
          PREVIEW_URL: ${{ inputs.preview_url }}
        run: |
          CONV=$(curl -sS -X POST "$PREVIEW_URL/api?resource=conversations" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{"contact_name":"ZZZ-TEST-ANALISI-PROMEMORIA-9205","is_client":true,"is_prospect":false}' \
            | jq -r '.data[0].id // empty')
          echo "conv_id=$CONV" >> "$GITHUB_OUTPUT"
          [ -z "$CONV" ] && { echo "::error::Conversazione di test non creata"; exit 0; }

          curl -sS -X POST "$PREVIEW_URL/api?resource=messages" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "{\"conversation_id\":\"$CONV\",\"sender\":\"me\",\"body\":\"Possiamo vederci mercoledì alle 9 per la revisione dei conti?\"}" > /dev/null
          curl -sS -X POST "$PREVIEW_URL/api?resource=messages" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "{\"conversation_id\":\"$CONV\",\"sender\":\"them\",\"body\":\"Mah, non so se riesco, ti faccio sapere\"}" > /dev/null

          RESP=$(curl -sS -X POST "$PREVIEW_URL/api?action=analizza_messaggio" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "{\"conversation_id\":\"$CONV\"}")
          echo "$RESP" | jq . || echo "$RESP"

          REMINDER=$(curl -sS "$SUPABASE_URL/rest/v1/tasks?select=id&title=eq.Ricontattare%20ZZZ-TEST-ANALISI-PROMEMORIA-9205" \
            -H "apikey: $ANON_KEY" -H "Authorization: Bearer $TOKEN" | jq -r '.[0].id // empty')
          echo "reminder_id=$REMINDER" >> "$GITHUB_OUTPUT"
          echo "Promemoria creato: $([ -n "$REMINDER" ] && echo si || echo NO) (atteso: si)"

          curl -sS -X POST "$PREVIEW_URL/api?resource=messages" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "{\"conversation_id\":\"$CONV\",\"sender\":\"them\",\"body\":\"Va bene, allora confermo mercoledì alle 9\"}" > /dev/null

          RESP2=$(curl -sS -X POST "$PREVIEW_URL/api?action=analizza_messaggio" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "{\"conversation_id\":\"$CONV\"}")
          echo "$RESP2" | jq . || echo "$RESP2"
          N=$(echo "$RESP2" | jq '[.azioni[]? | select(.tool=="crea_impegno")] | length')
          echo "Appuntamenti creati alla conferma: $N (atteso: 1)"

          if [ -n "$REMINDER" ]; then
            ANCORA=$(curl -sS "$SUPABASE_URL/rest/v1/tasks?select=id&id=eq.$REMINDER" \
              -H "apikey: $ANON_KEY" -H "Authorization: Bearer $TOKEN" | jq 'length')
            echo "Promemoria ancora presente dopo la conferma: $ANCORA (atteso: 0, va tolto)"
          fi

      # ------------------------------------------------------------
      # Test 11-13: il Cestino (eliminare sposta nel cestino invece di
      # cancellare, si ripristina o si elimina per sempre da lì) sul
      # CRUD generico (handleResource in api/index.js), che è lo stesso
      # percorso usato dal frontend tramite dbDelete/dbRestore.
      # ------------------------------------------------------------

      - name: "Test 11 — Cestino: eliminare un cliente lo sposta nel cestino, non lo cancella, e si può ripristinare"
        if: steps.login.outputs.puo_procedere == 'si'
        id: cestino_cliente
        env:
          TOKEN: ${{ steps.login.outputs.token }}
          PREVIEW_URL: ${{ inputs.preview_url }}
        run: |
          CID=$(curl -sS -X POST "$PREVIEW_URL/api?resource=clients" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{"name":"ZZZ-TEST-CESTINO-9301","status":"attivo"}' | jq -r '.data[0].id // empty')
          echo "cliente_id=$CID" >> "$GITHUB_OUTPUT"
          [ -z "$CID" ] && { echo "::error::Cliente di test non creato"; exit 0; }

          curl -sS -X DELETE "$PREVIEW_URL/api?resource=clients&id=$CID" -H "Authorization: Bearer $TOKEN" | jq .

          NORMALE=$(curl -sS "$PREVIEW_URL/api?resource=clients" -H "Authorization: Bearer $TOKEN" | jq --arg id "$CID" '[.data[] | select(.id==$id)] | length')
          echo "Presente nella lista normale dopo l'eliminazione: $NORMALE (atteso: 0)"

          CESTINO=$(curl -sS "$PREVIEW_URL/api?resource=clients&cestino=1" -H "Authorization: Bearer $TOKEN" | jq --arg id "$CID" '[.data[] | select(.id==$id)] | length')
          echo "Presente nel cestino dopo l'eliminazione: $CESTINO (atteso: 1)"

          curl -sS -X PATCH "$PREVIEW_URL/api?resource=clients&id=$CID" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{"deleted_at":null}' > /dev/null

          RIPRISTINATO=$(curl -sS "$PREVIEW_URL/api?resource=clients" -H "Authorization: Bearer $TOKEN" | jq --arg id "$CID" '[.data[] | select(.id==$id)] | length')
          echo "Presente nella lista normale dopo il ripristino: $RIPRISTINATO (atteso: 1)"

      - name: "Test 12 — Cestino: non si elimina per sempre qualcosa che non è già cestinato; da cestinato sì, e sparisce anche da lì"
        if: steps.cestino_cliente.outputs.cliente_id != ''
        env:
          TOKEN: ${{ steps.login.outputs.token }}
          PREVIEW_URL: ${{ inputs.preview_url }}
          CID: ${{ steps.cestino_cliente.outputs.cliente_id }}
        run: |
          CODE=$(curl -sS -o /tmp/forever.json -w "%{http_code}" -X DELETE "$PREVIEW_URL/api?resource=clients&id=$CID&permanente=true" -H "Authorization: Bearer $TOKEN")
          echo "Tentativo di eliminazione per sempre SENZA prima cestinare — codice HTTP: $CODE (atteso: 400)"
          cat /tmp/forever.json | jq . || cat /tmp/forever.json

          curl -sS -X DELETE "$PREVIEW_URL/api?resource=clients&id=$CID" -H "Authorization: Bearer $TOKEN" > /dev/null

          RESP=$(curl -sS -X DELETE "$PREVIEW_URL/api?resource=clients&id=$CID&permanente=true" -H "Authorization: Bearer $TOKEN")
          echo "$RESP" | jq . || echo "$RESP"

          CESTINO=$(curl -sS "$PREVIEW_URL/api?resource=clients&cestino=1" -H "Authorization: Bearer $TOKEN" | jq --arg id "$CID" '[.data[] | select(.id==$id)] | length')
          echo "Presente nel cestino dopo l'eliminazione definitiva: $CESTINO (atteso: 0, sparito per sempre)"

      - name: "Test 13 — Cestino: un messaggio di chat si può eliminare e ripristinare senza toccare la conversazione"
        if: steps.login.outputs.puo_procedere == 'si'
        id: cestino_messaggio
        env:
          TOKEN: ${{ steps.login.outputs.token }}
          PREVIEW_URL: ${{ inputs.preview_url }}
        run: |
          CONV=$(curl -sS -X POST "$PREVIEW_URL/api?resource=conversations" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{"contact_name":"ZZZ-TEST-CESTINO-MSG-9302","is_client":true,"is_prospect":false}' \
            | jq -r '.data[0].id // empty')
          echo "conv_id=$CONV" >> "$GITHUB_OUTPUT"
          [ -z "$CONV" ] && { echo "::error::Conversazione di test non creata"; exit 0; }

          MID=$(curl -sS -X POST "$PREVIEW_URL/api?resource=messages" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "{\"conversation_id\":\"$CONV\",\"sender\":\"me\",\"body\":\"Messaggio di prova da eliminare\"}" | jq -r '.data[0].id // empty')
          [ -z "$MID" ] && { echo "::error::Messaggio di test non creato"; exit 0; }

          curl -sS -X DELETE "$PREVIEW_URL/api?resource=messages&id=$MID" -H "Authorization: Bearer $TOKEN" > /dev/null

          NORMALE=$(curl -sS "$PREVIEW_URL/api?resource=messages&conversation_id=$CONV" -H "Authorization: Bearer $TOKEN" | jq --arg id "$MID" '[.data[] | select(.id==$id)] | length')
          echo "Messaggio presente nella conversazione dopo l'eliminazione: $NORMALE (atteso: 0)"

          CESTINO=$(curl -sS "$PREVIEW_URL/api?resource=messages&conversation_id=$CONV&cestino=1" -H "Authorization: Bearer $TOKEN" | jq --arg id "$MID" '[.data[] | select(.id==$id)] | length')
          echo "Messaggio presente nel cestino: $CESTINO (atteso: 1)"

      # ------------------------------------------------------------
      # Test 14-15: eliminare detto all'assistente AI (elimina_impegno,
      # elimina_cliente) — entrambi tool "sensitive", devono fermarsi e
      # chiedere conferma prima di spostare qualcosa nel cestino.
      # ------------------------------------------------------------

      - name: "Test 14 — AI: elimina_impegno chiede conferma, poi sposta l'impegno nel cestino"
        if: steps.login.outputs.puo_procedere == 'si'
        env:
          SUPABASE_URL: ${{ steps.config.outputs.supabase_url }}
          ANON_KEY: ${{ steps.config.outputs.anon }}
          TOKEN: ${{ steps.login.outputs.token }}
          PREVIEW_URL: ${{ inputs.preview_url }}
        run: |
          RESP=$(curl -sS -X POST "$PREVIEW_URL/api?action=assistant" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{"messaggio":"Segna una commissione chiamata ZZZ-test-elimina-impegno-9401 per domani alle 9, poi eliminala subito."}')
          echo "$RESP" | jq . || echo "$RESP"

          STATO=$(echo "$RESP" | jq -r '.stato')
          RUNID=$(echo "$RESP" | jq -r '.runId // empty')
          echo "Stato dopo la richiesta di eliminazione: $STATO (atteso: in_attesa_conferma)"

          if [ -n "$RUNID" ]; then
            CONFRESP=$(curl -sS -X POST "$PREVIEW_URL/api?action=assistant" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              -d "{\"runId\":\"$RUNID\",\"conferma\":true}")
            echo "$CONFRESP" | jq . || echo "$CONFRESP"
          fi

          CESTINO=$(curl -sS "$SUPABASE_URL/rest/v1/tasks?select=id&title=eq.ZZZ-test-elimina-impegno-9401&deleted_at=not.is.null" \
            -H "apikey: $ANON_KEY" -H "Authorization: Bearer $TOKEN" | jq 'length')
          echo "Impegno presente nel cestino dopo la conferma: $CESTINO (atteso: 1)"

      - name: "Test 15 — AI: elimina_cliente chiede conferma (inclusa la conversazione), poi sposta entrambi nel cestino"
        if: steps.login.outputs.puo_procedere == 'si'
        env:
          SUPABASE_URL: ${{ steps.config.outputs.supabase_url }}
          ANON_KEY: ${{ steps.config.outputs.anon }}
          TOKEN: ${{ steps.login.outputs.token }}
          PREVIEW_URL: ${{ inputs.preview_url }}
        run: |
          curl -sS -X POST "$PREVIEW_URL/api?resource=clients" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{"name":"ZZZ-TEST-AI-ELIMINA-9402","status":"attivo"}' > /dev/null
          curl -sS -X POST "$PREVIEW_URL/api?resource=conversations" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{"contact_name":"ZZZ-TEST-AI-ELIMINA-9402","is_client":true,"is_prospect":false}' > /dev/null

          RESP=$(curl -sS -X POST "$PREVIEW_URL/api?action=assistant" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{"messaggio":"Cerca il cliente ZZZ-TEST-AI-ELIMINA-9402 ed eliminalo insieme alla sua conversazione."}')
          echo "$RESP" | jq . || echo "$RESP"

          STATO=$(echo "$RESP" | jq -r '.stato')
          RUNID=$(echo "$RESP" | jq -r '.runId // empty')
          DOMANDA=$(echo "$RESP" | jq -r '.domanda // empty')
          echo "Stato dopo la richiesta di eliminazione: $STATO (atteso: in_attesa_conferma)"
          echo "Domanda di conferma: $DOMANDA (deve nominare anche la conversazione)"

          if [ -n "$RUNID" ]; then
            CONFRESP=$(curl -sS -X POST "$PREVIEW_URL/api?action=assistant" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              -d "{\"runId\":\"$RUNID\",\"conferma\":true}")
            echo "$CONFRESP" | jq . || echo "$CONFRESP"
            CONV_ELIMINATA=$(echo "$CONFRESP" | jq -r '[.azioni[]? | select(.tool=="elimina_cliente")][0].esito.conversazione_eliminata // empty')
            echo "Conversazione eliminata insieme al cliente: $CONV_ELIMINATA (atteso: true)"
          fi

          CLIENTE_CESTINO=$(curl -sS "$SUPABASE_URL/rest/v1/clients?select=id&name=eq.ZZZ-TEST-AI-ELIMINA-9402&deleted_at=not.is.null" \
            -H "apikey: $ANON_KEY" -H "Authorization: Bearer $TOKEN" | jq 'length')
          echo "Cliente presente nel cestino dopo la conferma: $CLIENTE_CESTINO (atteso: 1)"

          CONV_CESTINO=$(curl -sS "$SUPABASE_URL/rest/v1/conversations?select=id&contact_name=eq.ZZZ-TEST-AI-ELIMINA-9402&deleted_at=not.is.null" \
            -H "apikey: $ANON_KEY" -H "Authorization: Bearer $TOKEN" | jq 'length')
          echo "Conversazione presente nel cestino dopo la conferma: $CONV_CESTINO (atteso: 1)"

      - name: "Pulizia mirata — solo le righe create da questo test, mai un cancella-tutto"
        if: always() && steps.login.outputs.puo_procedere == 'si'
        env:
          SUPABASE_URL: ${{ steps.config.outputs.supabase_url }}
          ANON_KEY: ${{ steps.config.outputs.anon }}
          TOKEN: ${{ steps.login.outputs.token }}
          TASK_IDS: ${{ steps.impegni.outputs.task_ids }}
          CLIENTE_ID: ${{ steps.cliente.outputs.cliente_id }}
        run: |
          if [ -n "$TASK_IDS" ]; then
            echo "Elimino i task di test: $TASK_IDS"
            curl -sS -X DELETE "$SUPABASE_URL/rest/v1/tasks?id=in.($TASK_IDS)" \
              -H "apikey: $ANON_KEY" -H "Authorization: Bearer $TOKEN" || true
          fi

          if [ -n "$CLIENTE_ID" ]; then
            echo "Cerco la conversazione legata al cliente di test..."
            CONV=$(curl -sS "$SUPABASE_URL/rest/v1/conversations?select=id&contact_name=eq.ZZZ-TEST-CANCELLARE-9099" \
              -H "apikey: $ANON_KEY" -H "Authorization: Bearer $TOKEN" | jq -r '.[0].id // empty')

            if [ -n "$CONV" ]; then
              echo "Elimino i messaggi della conversazione di test ($CONV)..."
              curl -sS -X DELETE "$SUPABASE_URL/rest/v1/messages?conversation_id=eq.$CONV" \
                -H "apikey: $ANON_KEY" -H "Authorization: Bearer $TOKEN" || true
              echo "Elimino la conversazione di test..."
              curl -sS -X DELETE "$SUPABASE_URL/rest/v1/conversations?id=eq.$CONV" \
                -H "apikey: $ANON_KEY" -H "Authorization: Bearer $TOKEN" || true
            fi

            echo "Elimino il cliente di test ($CLIENTE_ID)..."
            curl -sS -X DELETE "$SUPABASE_URL/rest/v1/clients?id=eq.$CLIENTE_ID" \
              -H "apikey: $ANON_KEY" -H "Authorization: Bearer $TOKEN" || true
          fi

          # Conversazioni create dai test 6-10 dell'analisi chat: nomi
          # fissi e inequivocabilmente finti, cerchiamo per nome invece
          # di fare affidamento sugli output dei singoli step (così la
          # pulizia funziona anche se uno step precedente è fallito a
          # metà, senza per questo lasciare righe di test in giro).
          for NOME in ZZZ-TEST-ANALISI-NUOVO-9201 ZZZ-TEST-ANALISI-PROPOSTA-9202 ZZZ-TEST-ANALISI-SPOSTA-9203 ZZZ-TEST-ANALISI-ANNULLA-9204 ZZZ-TEST-ANALISI-PROMEMORIA-9205 ZZZ-TEST-CESTINO-MSG-9302 ZZZ-TEST-AI-ELIMINA-9402; do
            CONV=$(curl -sS "$SUPABASE_URL/rest/v1/conversations?select=id&contact_name=eq.$NOME" \
              -H "apikey: $ANON_KEY" -H "Authorization: Bearer $TOKEN" | jq -r '.[0].id // empty')
            if [ -n "$CONV" ]; then
              echo "Elimino la conversazione di test $NOME ($CONV)..."
              curl -sS -X DELETE "$SUPABASE_URL/rest/v1/messages?conversation_id=eq.$CONV" \
                -H "apikey: $ANON_KEY" -H "Authorization: Bearer $TOKEN" || true
              curl -sS -X DELETE "$SUPABASE_URL/rest/v1/conversations?id=eq.$CONV" \
                -H "apikey: $ANON_KEY" -H "Authorization: Bearer $TOKEN" || true
            fi
          done

          # Il promemoria del Test 10 dovrebbe già essere stato tolto
          # dal codice stesso; lo cerchiamo comunque per sicurezza, nel
          # caso quel passaggio non sia arrivato fino in fondo.
          curl -sS -X DELETE "$SUPABASE_URL/rest/v1/tasks?title=eq.Ricontattare%20ZZZ-TEST-ANALISI-PROMEMORIA-9205" \
            -H "apikey: $ANON_KEY" -H "Authorization: Bearer $TOKEN" || true

          # Il cliente del Test 11/12 dovrebbe già essere stato
          # eliminato per sempre dal test stesso; una cancellazione
          # diretta per nome è una rete di sicurezza se un'asserzione
          # a metà test avesse interrotto lo script prima di arrivarci
          # (funziona sia che sia ancora attivo sia che sia nel cestino:
          # DELETE diretto non guarda deleted_at).
          curl -sS -X DELETE "$SUPABASE_URL/rest/v1/clients?name=eq.ZZZ-TEST-CESTINO-9301" \
            -H "apikey: $ANON_KEY" -H "Authorization: Bearer $TOKEN" || true

          # L'impegno del Test 14 e il cliente del Test 15: cestinati
          # dall'assistente durante il test, li eliminiamo per davvero
          # qui (per nome/titolo, non per id, stessa rete di sicurezza).
          curl -sS -X DELETE "$SUPABASE_URL/rest/v1/tasks?title=eq.ZZZ-test-elimina-impegno-9401" \
            -H "apikey: $ANON_KEY" -H "Authorization: Bearer $TOKEN" || true
          curl -sS -X DELETE "$SUPABASE_URL/rest/v1/clients?name=eq.ZZZ-TEST-AI-ELIMINA-9402" \
            -H "apikey: $ANON_KEY" -H "Authorization: Bearer $TOKEN" || true

          echo "Pulizia completata: toccate solo le righe create da questo test."
